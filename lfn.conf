# lfn.conf — Linux From Nothing (Arch host edition) build configuration
# Sourced by ./lfn.  Override anything here from the environment.

# ---------------------------------------------------------------- layout ---
# $LFN_WORK holds everything big and regenerable; it deliberately lives next
# to the primary checkout, not inside it.
: "${LFN:=$LFN_WORK/root}"           # the guest root tree (DESTDIR target)
: "${SOURCES:=$LFN_WORK/sources}"    # downloaded tarballs
: "${SRC:=$LFN_WORK/src}"            # unpacked / cloned sources
: "${BUILD:=$LFN_WORK/build}"        # out-of-tree build directories
: "${OUT:=$LFN_WORK/out}"            # bzImage, disk images
: "${LOGS:=$LFN_WORK/logs}"
: "${STAMPS:=$LFN_WORK/stamps}"
: "${FAKEROOT_STATE:=$LFN_WORK/fakeroot.state}"

# ----------------------------------------------------------------- build ---
: "${JOBS:=$(nproc)}"
: "${KEEP_BUILD_DIRS:=0}"            # 1 = keep build trees after a good install
: "${MIN_FREE_GB:=20}"               # preflight free-space requirement

# --------------------------------------------------------------- versions ---
# glibc MUST match the host's: every Phase 1-3 binary is compiled by the host
# toolchain against host headers, so the guest libc has to provide at least
# the same symbol versions.
: "${GLIBC_VER:=$(ldd --version 2>/dev/null | sed -n '1s/.*[^0-9.]\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')}"
: "${NCURSES_VER:=6.6}"
: "${ZSH_VER:=5.9.2}"
: "${COREUTILS_VER:=9.11}"
: "${UTIL_LINUX_VER:=2.42.2}"
: "${UTIL_LINUX_SERIES:=2.42}"
: "${NANO_VER:=9.2}"

# Phase 2 — networking
: "${ZLIB_VER:=1.3.1}"
: "${LIBCAP_VER:=2.78}"
: "${IPROUTE2_VER:=6.18.0}"
: "${OPENSSL_VER:=3.6.3}"
: "${PCRE2_VER:=10.46}"
: "${WGET_VER:=1.25.0}"
: "${DNSMASQ_VER:=2.92}"

# Phase 3 — self-hosting toolchain
: "${BINUTILS_VER:=2.45}"
: "${GCC_VER:=15.2.0}"
: "${GMP_VER:=6.3.0}"
: "${MPFR_VER:=4.2.2}"
: "${MPC_VER:=1.3.1}"
: "${MAKE_VER:=4.4.1}"
: "${M4_VER:=1.4.20}"
: "${SED_VER:=4.9}"
: "${GREP_VER:=3.12}"
: "${GAWK_VER:=5.3.2}"
: "${TAR_VER:=1.35}"
: "${GZIP_VER:=1.14}"
: "${XZ_VER:=5.8.1}"
: "${BZIP2_VER:=1.0.8}"
: "${DIFFUTILS_VER:=3.12}"
: "${FINDUTILS_VER:=4.10.0}"
: "${PATCH_VER:=2.8}"
: "${BISON_VER:=3.8.2}"
: "${PERL_VER:=5.42.0}"
: "${FILE_VER:=5.46}"
: "${PKGCONF_VER:=2.5.1}"

# Phase 4 — git / curl / strace
: "${CURL_VER:=8.18.0}"
: "${GIT_VER:=2.52.0}"
: "${STRACE_VER:=6.18}"
: "${EXPAT_VER:=2.7.3}"

# Phase 5 — bootloader
: "${GRUB_VER:=2.12}"

# kernel: rolling, straight from Linus' tree (the doc's "rolling" spirit, and
# the only tree that reliably builds with a bleeding-edge host gcc)
: "${KERNEL_GIT:=https://github.com/torvalds/linux}"
: "${KERNEL_REF:=master}"

# ------------------------------------------------------------------ image ---
: "${IMAGE_SIZE_MB:=20480}"          # ext4 root filesystem size
: "${IMAGE_LABEL:=LFN}"

# ------------------------------------------------------------------ qemu ----
: "${QEMU_MEM:=8G}"
: "${QEMU_SMP:=$(nproc)}"
: "${QEMU_SSH_PORT:=2222}"

# --------------------------------------------------------- kernel config ----
# Every symbol we require to be =y after `make olddefconfig`.  The build
# asserts each one actually stuck: olddefconfig silently drops symbols whose
# dependencies are unmet, and a missing driver here surfaces as "unable to
# mount root fs" with no other clue.
KERNEL_ENABLE=(
  # --- core kernel ---------------------------------------------------------
  64BIT SMP MULTIUSER PRINTK PRINTK_TIME BUG SYSCTL PROC_SYSCTL
  FUTEX EPOLL SIGNALFD TIMERFD EVENTFD AIO ADVISE_SYSCALLS MEMBARRIER RSEQ
  POSIX_TIMERS POSIX_MQUEUE SYSVIPC FILE_LOCKING KALLSYMS
  SHMEM TMPFS BINFMT_ELF BINFMT_SCRIPT ELF_CORE
  KEYS BLOCK MSDOS_PARTITION
  # --- platform / timers ---------------------------------------------------
  ACPI PCI HPET_TIMER X86_MSR X86_CPUID
  RTC_CLASS RTC_HCTOSYS RTC_DRV_CMOS
  HW_RANDOM HW_RANDOM_VIRTIO
  # --- console -------------------------------------------------------------
  TTY UNIX98_PTYS SERIAL_8250 SERIAL_8250_CONSOLE SERIAL_8250_PCI
  VT VT_CONSOLE
  # --- devices -------------------------------------------------------------
  DEVTMPFS DEVTMPFS_MOUNT
  VIRTIO_MENU VIRTIO_PCI VIRTIO_BLK VIRTIO_NET VIRTIO_CONSOLE
  ATA ATA_PIIX SATA_AHCI BLK_DEV_SD SCSI SCSI_LOWLEVEL
  # --- networking ----------------------------------------------------------
  NET PACKET UNIX INET IP_MULTICAST NETDEVICES ETHERNET NET_VENDOR_INTEL E1000
  DNS_RESOLVER
  # --- filesystems ---------------------------------------------------------
  EXT4_FS PROC_FS SYSFS INOTIFY_USER FANOTIFY FHANDLE DEVPTS_FS
  # --- misc that userland trips over ---------------------------------------
  SECCOMP SECCOMP_FILTER
)

# Symbols that must be OFF.  MODULES is the load-bearing one: there is no
# module loader in this userland and no initramfs, so anything =m is absent.
KERNEL_DISABLE=(
  MODULES DEBUG_INFO_BTF DEBUG_INFO_DWARF5 GCC_PLUGINS
)
